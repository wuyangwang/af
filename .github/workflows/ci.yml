name: CI & Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0). Leave empty to use Cargo.toml version.'
        required: false
        type: string

permissions:
  contents: write

env:
  BIN_NAME: af

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message || '', 'chore(release):'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Resolved version '$VERSION' is invalid (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create and push tag if missing
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git rev-parse "$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; skipping release build."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Created and pushed tag $VERSION"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Smoke test CLI
        shell: bash
        run: |
          cargo run -p af-cli -- --help
          cargo run -p af-cli -- read Cargo.toml --meta --json

  build:
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (needs.create-tag.result == 'success' && needs.create-tag.outputs.released == 'true'))
    needs: [create-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.create-tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p af-cli --release --target ${{ matrix.target }} --verbose

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          $name = "${{ env.BIN_NAME }}-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.bin_ext }}" "dist/$name/"
          Copy-Item "README.md","LICENSE" "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          name="${BIN_NAME}-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/$name/"
          chmod +x "dist/$name/${BIN_NAME}"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" | awk '{print tolower($1)"  "$2}' > "$name.tar.gz.sha256")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (needs.create-tag.result == 'success' && needs.create-tag.outputs.released == 'true'))
    needs: [create-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.create-tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
